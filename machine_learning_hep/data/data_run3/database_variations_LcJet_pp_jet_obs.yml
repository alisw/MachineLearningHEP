categories:
  default:
    activate: no
    processor: false
    label: "default"
    correlation: "corr"
    rms: true
    symmetrise: true
    rms_both_sides: true
    variations:
      default:
        activate: [yes]
        label: ["default"]
        diffs: {}
  fitting:
    activate: yes
    processor: false
    label: "fitting"
    group: "signal extraction"
    correlation: "corr"
    rms: true
    symmetrise: true
    rms_both_sides: true

        - level: mc
          ptrange: [0., 3.]
          range: [2.18, 2.39]
          components:
            sig:
              #fn: 'Gaussian::sig(m[1., 10], mean[2.286, 2.2832,2.289], sigma_g1[.007,.007,.012])'
              fn: 'RooCrystalBall::sig(m[1., 10], mean[2.286, 2.283, 2.289], sigma_g1[0.007, 0.007, 0.012], alpha1[1.0, 0.8, 2.0], n1[30., 30., 100.0], alpha2[1.0, 0.8, 2.0], n2[30., 30., 100.0])'

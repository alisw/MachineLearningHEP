            #  fn: 'SUM::sig(f_peak[0.,1.]*peak, wide)'
            bkg:
              fn: 'Exponential::mcbkg(m, mcalpha[0.])'
            model:
              fn: 'SUM::mctot(mcfrac[0., 0., 1.0]*sig, mcbkg)'
